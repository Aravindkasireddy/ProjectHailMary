# Nginx Server Configuration for arkfarms.store
# Place this at /etc/nginx/sites-available/arkfarms.store on your GCE VM

server {
    listen 80;
    server_name arkfarms.store www.arkfarms.store;

    # Redirect all HTTP requests to HTTPS (Certbot will automate this, but keep this as fallback)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # API Backend Reverse Proxy (routes all /api calls to Docker container on port 8080)
    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeouts for long-running scrape/classification requests
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Frontend Dashboard (routes all other traffic to Next.js on port 3000)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
