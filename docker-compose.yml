# Gemini-jobsearch — API + Next.js dashboard
#
# Default host ports: API 8080, web 3000. If busy, set in .env (see .env.example):
#   JOBSEARCH_API_HOST_PORT=8081
#   JOBSEARCH_WEB_HOST_PORT=3001
# Then: docker compose up --build  (web image rebuild picks up NEXT_PUBLIC_API_URL)
#
#   docker compose up --build
#
# Open http://localhost:${JOBSEARCH_WEB_HOST_PORT:-3000}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      JOBSEARCH_DASHBOARD_PORT: "8080"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "${JOBSEARCH_API_HOST_PORT:-8080}:8080"
    volumes:
      - .:/app
    working_dir: /app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-}
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports:
      - "${JOBSEARCH_WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
