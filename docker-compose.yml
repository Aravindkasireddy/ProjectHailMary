# Gemini-jobsearch — API + Next.js dashboard behind Nginx
#
# Single entry point: http://localhost:${NGINX_HOST_PORT:-80}
#   /api/* → api:8080 (Python backend)
#   /*     → web:3000 (Next.js frontend)
#
# api and web no longer expose host ports — all traffic goes through nginx.
# Override the nginx port if 80 is busy:
#   NGINX_HOST_PORT=8090
#
#   docker compose up --build

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      JOBSEARCH_DASHBOARD_PORT: "8080"
      REDIS_URL: "redis://redis:6379/0"
    # Port not exposed to host — nginx is the sole entry point
    expose:
      - "8080"
    volumes:
      - .:/app
    working_dir: /app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-}
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # /api is a same-origin path — no host/port needed in browser requests
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    # Port not exposed to host — nginx is the sole entry point
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
